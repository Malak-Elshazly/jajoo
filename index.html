<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jeje — Store & Checkout</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pink: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Playfair+Display:wght@700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #fdf2f8; }
        .brand-logo { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-pink-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-white/80 backdrop-blur-md border-b border-pink-200 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="#" onclick="showSection('store')" class="flex items-center gap-2">
                <span class="brand-logo text-3xl font-bold text-pink-600">jeje</span>
                <span class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span>
            </a>
            
            <nav class="flex items-center gap-6">
                <button onclick="showSection('store')" class="text-sm font-bold text-slate-700 hover:text-pink-600 transition">المتجر</button>
                <button onclick="showSection('checkout')" class="relative flex items-center gap-2 bg-pink-100 hover:bg-pink-200 text-pink-700 px-4 py-2 rounded-full font-bold text-sm transition">
                    <i class="fa-solid fa-cart-shopping text-pink-600"></i>
                    <span>السلة</span>
                    <span id="cart-badge" class="bg-pink-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">

        <!-- SECTION 1: STORE FRONT -->
        <section id="store-section" class="space-y-8">
            <div class="bg-gradient-to-r from-pink-500 to-rose-400 text-white rounded-3xl p-8 text-center shadow-lg relative overflow-hidden">
                <h1 class="brand-logo text-4xl sm:text-5xl font-bold mb-2">jeje Boutique</h1>
                <p class="text-pink-100 text-sm sm:text-base">تشكيلة أنيقة ومختارة بعناية لأجلكِ ✨</p>
            </div>

            <!-- Products Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="products-grid">
                <!-- Injected by JavaScript -->
            </div>
        </section>

        <!-- SECTION 2: CHECKOUT -->
        <section id="checkout-section" class="hidden space-y-6">
            <button onclick="showSection('store')" class="text-xs font-bold text-pink-600 hover:underline flex items-center gap-2">
                <i class="fa-solid fa-arrow-right"></i> العودة للمتجر
            </button>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <!-- Checkout Form -->
                <div class="lg:col-span-7 bg-white p-6 rounded-3xl border border-pink-200 shadow-sm space-y-6">
                    <h2 class="text-xl font-bold text-slate-800 border-b border-pink-100 pb-3">تفاصيل الشحن والطلب</h2>
                    
                    <form onsubmit="handleOrderSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">الاسم بالكامل</label>
                            <input type="text" required placeholder="أدخلي اسمك الكامل" class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:border-pink-500 text-sm bg-pink-50/20">
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف</label>
                                <input type="tel" required placeholder="01xxxxxxxxx" class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:border-pink-500 text-sm bg-pink-50/20">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">المحافظة</label>
                                <select id="gov-select" onchange="calculateTotal()" class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:border-pink-500 text-sm bg-pink-50/20">
                                    <option value="50">القاهرة والجيزة (شحن 50 ج.م)</option>
                                    <option value="65">الإسكندرية والوجه البحري (شحن 65 ج.م)</option>
                                    <option value="80">باقي المحافظات (شحن 80 ج.م)</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">العنوان التفصيلي</label>
                            <input type="text" required placeholder="اسم الشارع، رقم العمارة، الشقة" class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:border-pink-500 text-sm bg-pink-50/20">
                        </div>

                        <div class="pt-4 border-t border-pink-100">
                            <label class="block text-xs font-bold text-slate-700 mb-2">طريقة الدفع</label>
                            <div class="space-y-2">
                                <label class="flex items-center gap-3 p-3 border border-pink-200 rounded-xl cursor-pointer bg-pink-50/30">
                                    <input type="radio" name="pay" checked class="accent-pink-600">
                                    <span class="text-sm font-medium">الدفع عند الاستلام (Cash on Delivery)</span>
                                </label>
                                <label class="flex items-center gap-3 p-3 border border-pink-200 rounded-xl cursor-pointer bg-pink-50/30">
                                    <input type="radio" name="pay" class="accent-pink-600">
                                    <span class="text-sm font-medium">فودافون كاش / محفظة إلكترونية</span>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold py-4 rounded-xl shadow-lg hover:from-pink-600 hover:to-rose-600 transition mt-6">
                            تأكيد الطلب الآن ✨
                        </button>
                    </form>
                </div>

                <!-- Order Summary Sidebar -->
                <div class="lg:col-span-5 bg-white p-6 rounded-3xl border border-pink-200 shadow-sm h-fit space-y-4">
                    <h3 class="text-lg font-bold text-slate-800 border-b border-pink-100 pb-3">ملخص السلة</h3>
                    
                    <div id="checkout-cart-items" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                        <!-- Dynamic items -->
                    </div>

                    <div class="pt-4 border-t border-pink-100 space-y-2 text-sm text-slate-600">
                        <div class="flex justify-between"><span>المجموع الفرعي</span><span id="subtotal-val" class="font-bold text-slate-800">0 ج.م</span></div>
                        <div class="flex justify-between"><span>مصاريف الشحن</span><span id="shipping-val" class="font-bold text-slate-800">50 ج.م</span></div>
                        <div class="flex justify-between text-base font-bold text-pink-600 pt-2 border-t border-pink-100">
                            <span>الإجمالي</span>
                            <span id="grandtotal-val">0 ج.م</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-pink-200 py-6 text-center text-xs text-slate-400">
        <p>© 2026 جميع الحقوق محفوظة لـ <span class="brand-logo text-pink-600 font-bold text-sm">jeje</span></p>
    </footer>

    <!-- Success Modal -->
    <div id="success-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center border border-pink-100 shadow-2xl space-y-4">
            <div class="w-16 h-16 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center text-3xl mx-auto">
                <i class="fa-solid fa-heart"></i>
            </div>
            <h3 class="brand-logo text-3xl font-bold text-pink-600">jeje</h3>
            <h4 class="text-lg font-bold text-slate-800">تم استلام طلبكِ بنجاح!</h4>
            <p class="text-xs text-slate-500">سنقوم بالتواصل معكِ فوراً لتأكيد موعد التسليم.</p>
            <button onclick="resetStore()" class="w-full py-3 bg-pink-600 text-white font-bold rounded-xl text-sm hover:bg-pink-700 transition">
                العودة للمتجر
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const products = [
            { id: 1, name: "فستان حرير روز أنيق", price: 1450, image: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?auto=format&fit=crop&w=400&q=80" },
            { id: 2, name: "حقيبة مخملية وردية", price: 980, image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=400&q=80" },
            { id: 3, name: "أقراط لؤلؤ روز جولد", price: 350, image: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=400&q=80" }
        ];

        let cart = [];

        window.onload = () => {
            renderProducts();
        };

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-3xl border border-pink-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <img src="${p.image}" alt="${p.name}" class="w-full h-56 object-cover">
                    <div class="p-5 space-y-3">
                        <h3 class="font-bold text-slate-800">${p.name}</h3>
                        <div class="flex items-center justify-between">
                            <span class="text-pink-600 font-bold">${p.price} ج.م</span>
                            <button onclick="addToCart(${p.id})" class="bg-pink-100 hover:bg-pink-600 hover:text-white text-pink-700 px-4 py-2 rounded-xl text-xs font-bold transition">
                                + إضافة للسلة
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            const inCart = cart.find(c => c.id === id);
            if(inCart) {
                inCart.qty++;
            } else {
                cart.push({...item, qty: 1});
            }
            updateCartBadge();
        }

        function updateCartBadge() {
            const count = cart.reduce((acc, curr) => acc + curr.qty, 0);
            document.getElementById('cart-badge').innerText = count;
        }

        function showSection(section) {
            if(section === 'store') {
                document.getElementById('store-section').classList.remove('hidden');
                document.getElementById('checkout-section').classList.add('hidden');
            } else {
                if(cart.length === 0) {
                    alert('السلة فارغة، يرجى إضافة منتجات أولاً.');
                    return;
                }
                document.getElementById('store-section').classList.add('hidden');
                document.getElementById('checkout-section').classList.remove('hidden');
                renderCheckoutCart();
            }
        }

        function renderCheckoutCart() {
            const container = document.getElementById('checkout-cart-items');
            container.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between bg-pink-50/50 p-2.5 rounded-xl border border-pink-100 text-xs">
                    <div>
                        <p class="font-bold text-slate-800">${item.name}</p>
                        <p class="text-slate-500">${item.qty} × ${item.price} ج.م</p>
                    </div>
                    <span class="font-bold text-pink-600">${item.qty * item.price} ج.م</span>
                </div>
            `).join('');
            calculateTotal();
        }

        function calculateTotal() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const shipping = parseInt(document.getElementById('gov-select').value) || 50;
            const grandTotal = subtotal + shipping;

            document.getElementById('subtotal-val').innerText = `${subtotal} ج.م`;
            document.getElementById('shipping-val').innerText = `${shipping} ج.م`;
            document.getElementById('grandtotal-val').innerText = `${grandTotal} ج.م`;
        }

        function handleOrderSubmit(e) {
            e.preventDefault();
            const modal = document.getElementById('success-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            if(window.confetti) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        }

        function resetStore() {
            cart = [];
            updateCartBadge();
            document.getElementById('success-modal').classList.add('opacity-0', 'pointer-events-none');
            showSection('store');
        }
    </script>
</body>
</html>
